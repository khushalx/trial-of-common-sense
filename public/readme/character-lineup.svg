<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">Courtroom character lineup</title>
  <desc id="desc">Four symbolic portrait cards for Judge Hawthorne, The Internet, Gerald Finch, and The Jury.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#21140f"/>
      <stop offset="1" stop-color="#0d0907"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b2518"/>
      <stop offset="1" stop-color="#1d120d"/>
    </linearGradient>
    <filter id="portraitShadow" x="-25%" y="-25%" width="150%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1400" height="560" fill="url(#backdrop)"/>
  <text x="700" y="56" text-anchor="middle" fill="#d9c8a8" font-family="Georgia,serif" font-size="31">Officers of the Court</text>
  <text x="700" y="82" text-anchor="middle" fill="#887860" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="4">IDENTITIES VERIFIED · JUDGMENT QUESTIONABLE</text>

  <!-- Judge -->
  <g transform="translate(55 112)" filter="url(#portraitShadow)">
    <rect width="300" height="390" fill="url(#card)" stroke="#745232"/>
    <rect x="10" y="10" width="280" height="370" fill="none" stroke="#967348" stroke-opacity="0.28"/>
    <circle cx="150" cy="124" r="76" fill="#15100d" stroke="#9c7a4d"/>
    <circle cx="150" cy="116" r="41" fill="#d2bfa0"/>
    <path d="M109 109q-8-53 41-57 50 4 41 57l-17-18-10 17-15-20-15 20-10-17z" fill="#d7d1c6"/>
    <circle cx="104" cy="98" r="17" fill="none" stroke="#d7d1c6" stroke-width="11"/>
    <circle cx="196" cy="98" r="17" fill="none" stroke="#d7d1c6" stroke-width="11"/>
    <path d="M121 119h20m18 0h20M141 119h18" stroke="#51453b" stroke-width="3"/>
    <circle cx="131" cy="119" r="9" fill="none" stroke="#51453b" stroke-width="2"/>
    <circle cx="169" cy="119" r="9" fill="none" stroke="#51453b" stroke-width="2"/>
    <path d="M137 143q13 7 26 0" fill="none" stroke="#73564a" stroke-width="2"/>
    <path d="M90 221q12-72 60-72t60 72" fill="#0b0908" stroke="#6f5439"/>
    <text x="150" y="251" text-anchor="middle" fill="#af8e58" font-family="Georgia,serif" font-size="35">§</text>
    <text x="150" y="298" text-anchor="middle" fill="#ddcfb4" font-family="Georgia,serif" font-size="23">Judge Hawthorne</text>
    <text x="150" y="326" text-anchor="middle" fill="#aa9169" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="2">PRESIDING JUDGE</text>
    <text x="150" y="354" text-anchor="middle" fill="#80715e" font-family="Georgia,serif" font-size="11" font-style="italic">Victorian. Pompous. Confused.</text>
  </g>

  <!-- Internet -->
  <g transform="translate(385 112)" filter="url(#portraitShadow)">
    <rect width="300" height="390" fill="url(#card)" stroke="#745232"/>
    <rect x="10" y="10" width="280" height="370" fill="none" stroke="#967348" stroke-opacity="0.28"/>
    <rect x="73" y="51" width="154" height="150" rx="5" fill="#11110f" stroke="#9c8c70"/>
    <rect x="84" y="63" width="132" height="112" fill="#d0c7b4"/>
    <text x="150" y="111" text-anchor="middle" fill="#302d29" font-family="Courier New,monospace" font-size="27" font-weight="700">@ # !</text>
    <path d="M92 128h88m-88 13h112m-112 13h68" stroke="#6d6457" stroke-width="3"/>
    <path d="M121 202v17h58v-17m-79 17h100" fill="none" stroke="#9c8c70" stroke-width="4"/>
    <path d="M62 88h24m-14 17h20m121 36h28m-22 16h16" stroke="#a13f36" stroke-width="4"/>
    <text x="150" y="298" text-anchor="middle" fill="#ddcfb4" font-family="Courier New,monospace" font-size="23">The Internet</text>
    <text x="150" y="326" text-anchor="middle" fill="#aa9169" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="2">FOR THE PROSECUTION</text>
    <text x="150" y="354" text-anchor="middle" fill="#80715e" font-family="Georgia,serif" font-size="11" font-style="italic">Certain. Contradictory. Trending.</text>
  </g>

  <!-- Gerald -->
  <g transform="translate(715 112)" filter="url(#portraitShadow)">
    <rect width="300" height="390" fill="url(#card)" stroke="#745232"/>
    <rect x="10" y="10" width="280" height="370" fill="none" stroke="#967348" stroke-opacity="0.28"/>
    <circle cx="150" cy="120" r="69" fill="#15100d" stroke="#80705b"/>
    <circle cx="150" cy="113" r="42" fill="#c7ae8d"/>
    <path d="M108 109q3-51 42-52 38 3 42 52-21-27-48-24z" fill="#64584b"/>
    <path d="M125 116h18m14 0h18" stroke="#5d4b40" stroke-width="3"/>
    <path d="M124 127q9 5 18 0m16 0q9 5 18 0" fill="none" stroke="#8c6f5a"/>
    <path d="M138 145q12-4 24 0" fill="none" stroke="#6a5044" stroke-width="2"/>
    <path d="M91 220q14-71 59-71t59 71" fill="#2e302f" stroke="#746a5c"/>
    <path d="M150 161v57m-25-56 25 27 25-27" fill="#dfd5c2" stroke="#837766"/>
    <path d="M143 188h14l5 31h-24z" fill="#67403b"/>
    <rect x="190" y="185" width="61" height="44" fill="#8f7653" stroke="#b49a72" transform="rotate(7 190 185)"/>
    <text x="150" y="298" text-anchor="middle" fill="#ddcfb4" font-family="Georgia,serif" font-size="23">Gerald Finch</text>
    <text x="150" y="326" text-anchor="middle" fill="#aa9169" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="2">COUNSEL FOR COMMON SENSE</text>
    <text x="150" y="354" text-anchor="middle" fill="#80715e" font-family="Georgia,serif" font-size="11" font-style="italic">Reasonable. Prepared. Doomed.</text>
  </g>

  <!-- Jury -->
  <g transform="translate(1045 112)" filter="url(#portraitShadow)">
    <rect width="300" height="390" fill="url(#card)" stroke="#745232"/>
    <rect x="10" y="10" width="280" height="370" fill="none" stroke="#967348" stroke-opacity="0.28"/>
    <g fill="#c1a985" stroke="#564436" stroke-width="2">
      <circle cx="96" cy="89" r="24"/><circle cx="150" cy="78" r="24"/><circle cx="204" cy="89" r="24"/>
      <circle cx="78" cy="145" r="24"/><circle cx="126" cy="136" r="24"/><circle cx="174" cy="136" r="24"/><circle cx="222" cy="145" r="24"/>
      <circle cx="96" cy="196" r="24"/><circle cx="150" cy="188" r="24"/><circle cx="204" cy="196" r="24"/>
    </g>
    <g fill="#292019">
      <circle cx="89" cy="86" r="2"/><circle cx="103" cy="86" r="2"/><circle cx="143" cy="75" r="2"/><circle cx="157" cy="75" r="2"/>
      <circle cx="197" cy="86" r="2"/><circle cx="211" cy="86" r="2"/><circle cx="119" cy="133" r="2"/><circle cx="133" cy="133" r="2"/>
      <circle cx="167" cy="133" r="2"/><circle cx="181" cy="133" r="2"/>
    </g>
    <g transform="translate(221 200) rotate(-8)">
      <rect x="-42" y="-16" width="84" height="32" fill="none" stroke="#a94840" stroke-width="3"/>
      <text y="5" text-anchor="middle" fill="#bd5a4f" font-family="Georgia,serif" font-size="14" font-weight="700">GUILTY</text>
    </g>
    <text x="150" y="298" text-anchor="middle" fill="#ddcfb4" font-family="Georgia,serif" font-size="23">The Jury</text>
    <text x="150" y="326" text-anchor="middle" fill="#aa9169" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="2">TWELVE IMPARTIALISH PEERS</text>
    <text x="150" y="354" text-anchor="middle" fill="#80715e" font-family="Georgia,serif" font-size="11" font-style="italic">Randomized. United. Wrong.</text>
  </g>

  <rect x="18" y="18" width="1364" height="524" fill="none" stroke="#8c693e" stroke-opacity="0.35"/>
</svg>
