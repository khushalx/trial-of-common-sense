<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Official case docket</title>
  <desc id="desc">An aged legal document for The Internet versus Common Sense, stamped guilty.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eee1c2"/>
      <stop offset="0.48" stop-color="#e1d1ad"/>
      <stop offset="1" stop-color="#cdbb94"/>
    </linearGradient>
    <filter id="paperNoise">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="4" seed="8"/>
      <feColorMatrix values=".65 0 0 0 .25  0 .52 0 0 .19  0 0 .35 0 .1  0 0 0 .12 0"/>
    </filter>
    <filter id="docketShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.48"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="#160e0a"/>
  <g filter="url(#docketShadow)">
    <path d="M112 42h976v636H112z" fill="url(#paper)"/>
    <path d="M112 42h976v636H112z" filter="url(#paperNoise)" opacity="0.5"/>
    <circle cx="220" cy="134" r="94" fill="#80663d" opacity="0.05"/>
    <circle cx="992" cy="590" r="122" fill="#6a3d29" opacity="0.055"/>
    <circle cx="190" cy="610" r="38" fill="none" stroke="#755431" stroke-width="15" opacity="0.06"/>
  </g>

  <g fill="none" stroke="#493c2f">
    <rect x="136" y="67" width="928" height="586" stroke-width="3"/>
    <rect x="146" y="77" width="908" height="566" stroke-width="1"/>
    <path d="M176 183h848M176 276h848M176 386h848M176 496h848" opacity="0.55"/>
  </g>

  <g fill="#302a22">
    <text x="600" y="116" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="5">SUPERIOR COURT OF PUBLIC OPINION</text>
    <text x="600" y="158" text-anchor="middle" font-family="Georgia,serif" font-size="30">OFFICIAL CASE DOCKET</text>
    <text x="176" y="229" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="3">CASE NO.</text>
    <text x="386" y="233" font-family="Georgia,serif" font-size="28">0047-∞</text>
    <text x="176" y="326" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="3">MATTER</text>
    <text x="386" y="333" font-family="Georgia,serif" font-size="32" font-weight="700">THE INTERNET v. COMMON SENSE</text>
    <text x="176" y="436" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="3">CHARGE</text>
    <text x="386" y="440" font-family="Georgia,serif" font-size="25">Attempted Reasoning in a Public Forum</text>
    <text x="176" y="550" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="3">VERDICT</text>
    <text x="386" y="556" font-family="Georgia,serif" font-size="34" font-weight="700">GUILTY</text>
    <text x="176" y="620" font-family="Georgia,serif" font-size="13" font-style="italic">Filed by the Clerk · Gerald Finch objects · Objection noted and ignored</text>
  </g>

  <g transform="translate(880 533) rotate(-9)" opacity="0.84">
    <circle r="86" fill="none" stroke="#9f3b34" stroke-width="6"/>
    <circle r="74" fill="none" stroke="#9f3b34" stroke-width="2"/>
    <text y="-24" text-anchor="middle" fill="#9f3b34" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="3">COURT OF PUBLIC OPINION</text>
    <text y="17" text-anchor="middle" fill="#a54138" font-family="Georgia,serif" font-size="33" font-weight="700" letter-spacing="3">GUILTY</text>
    <text y="43" text-anchor="middle" fill="#9f3b34" font-family="Arial,sans-serif" font-size="8" font-weight="700" letter-spacing="2">FINAL · NO APPEAL</text>
  </g>
</svg>
